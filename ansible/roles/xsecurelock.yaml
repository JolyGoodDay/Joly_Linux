- name: Install xsecurelock and dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - xsecurelock
      - xss-lock
      - mpv
      - apache2-utils
      - autotools-dev
      - autoconf
      - binutils
      - gcc
      - libc-dev
      - libpam0g-dev
      - libx11-dev
      - libxcomposite-dev
      - libxext-dev
      - libxfixes-dev
      - libxft-dev
      - libxmu-dev
      - libxrandr-dev
      - libxss-dev
      - make
      - pkg-config
      - libxtst-dev
    state: present
    update_cache: true
  become: true
  when: ansible_facts["os_family"] == "Debian"

- name: Install xsecurelock build dependencies (CentOS 9)
  ansible.builtin.dnf:
    name:
      - httpd-tools
      - autoconf
      - binutils
      - gcc
      - glibc-devel
      - pam-devel
      - libX11-devel
      - libXcomposite-devel
      - libXext-devel
      - libXfixes-devel
      - libXft-devel
      - libXmu-devel
      - libXrandr-devel
      - make
      - mpv
      - pamtester
      - pkg-config
      - libXtst-devel
      - libXScrnSaver-devel
    state: present
    update_cache: true
  become: true
  when: ansible_facts["os_family"] == "RedHat" and ansible_facts["distribution_major_version"] == "9"

- name: Clone xsecurelock source (CentOS)
  ansible.builtin.git:
    repo: https://github.com/google/xsecurelock.git
    dest: /tmp/xsecurelock-src
    depth: 1
  when: ansible_facts["os_family"] == "RedHat"

- name: Build and install xsecurelock (CentOS)
  ansible.builtin.shell: |
    cd /tmp/xsecurelock-src
    sh autogen.sh
    ./configure --with-pam-service-name=xscreensaver
    make
    make install
  args:
    creates: /usr/local/bin/xsecurelock
  become: true
  when: ansible_facts["os_family"] == "RedHat"
