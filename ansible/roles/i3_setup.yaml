- name: Apply CopyQ dark theme
  community.general.ini_file:
    path: "{{ ansible_user_dir }}/.config/copyq/copyq.conf"
    section: Theme
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { key: bg,              value: "#1d1f21" }
    - { key: alt_bg,          value: "#222426" }
    - { key: fg,              value: "#c5c8c6" }
    - { key: sel_bg,          value: "#2296ab" }
    - { key: sel_fg,          value: "#ffffff" }
    - { key: edit_bg,         value: "#252527" }
    - { key: edit_fg,         value: "#c5c8c6" }
    - { key: find_bg,         value: "#f0c674" }
    - { key: find_fg,         value: "#1d1f21" }
    - { key: num_fg,          value: "#666666" }
    - { key: notification_bg, value: "#1d1f21" }
    - { key: notification_fg, value: "#c5c8c6" }
    - { key: style_main_window, value: "true" }

- name: Install joy command
  ansible.builtin.copy:
    dest: /bin/joy
    mode: "0755"
    content: |
      #!/bin/bash
      exec "{{ joly_linux_dir }}/venv/bin/python3" "{{ joly_linux_dir }}/src/common/joy.py"
  become: true

- name: Set joly_linux path in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^joly_linux="
    line: "joly_linux='{{ joly_linux_dir }}'"
  become: true

- name: Remove old config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_user_dir }}/.config/i3"
    - "{{ ansible_user_dir }}/.i3"
    - "{{ ansible_user_dir }}/.config/i3status"
    - "{{ ansible_user_dir }}/.config/i3blocks"
    - "{{ ansible_user_dir }}/.config/alacritty"
    - "{{ ansible_user_dir }}/.config/khal"

- name: Copy i3 config
  ansible.builtin.copy:
    src: "{{ joly_linux_dir }}/src/i3/"
    dest: "{{ ansible_user_dir }}/.config/i3/"
    mode: preserve

- name: Copy alacritty config
  ansible.builtin.copy:
    src: "{{ joly_linux_dir }}/src/alacritty/"
    dest: "{{ ansible_user_dir }}/.config/alacritty/"
    mode: preserve

- name: Copy khal config
  ansible.builtin.copy:
    src: "{{ joly_linux_dir }}/src/khal/"
    dest: "{{ ansible_user_dir }}/.config/khal/"
    mode: preserve

- name: Create khal calendar directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/share/khal/calendars/private"
    state: directory
    mode: "0755"

- name: Create GTK3 config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/gtk-3.0"
    state: directory
    mode: "0755"

- name: Set GTK dark theme
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/gtk-3.0/settings.ini"
    create: true
    regexp: "^gtk-theme-name"
    line: "gtk-theme-name = Adwaita-dark"
    insertafter: "\\[Settings\\]"

- name: Ensure GTK settings section header exists
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/gtk-3.0/settings.ini"
    line: "[Settings]"
    insertbefore: "^gtk-theme-name"

- name: Create qt5ct config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/qt5ct"
    state: directory
    mode: "0755"

- name: Ensure qt5ct Appearance section header exists
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/qt5ct/qt5ct.conf"
    create: true
    line: "[Appearance]"
    insertbefore: BOF

- name: Set qt5ct style
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/qt5ct/qt5ct.conf"
    regexp: "^style="
    line: "style=gtk2"

- name: Set qt5ct palette
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/qt5ct/qt5ct.conf"
    regexp: "^palette="
    line: "palette=qt5ct"

- name: Configure Xresources URxvt theme
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.Xresources"
    create: true
    marker: "# {mark} ANSIBLE MANAGED - URxvt theme"
    block: |
      URxvt.background: black
      URxvt.foreground: white

- name: Load Xresources
  ansible.builtin.command: xrdb "{{ ansible_user_dir }}/.Xresources"
  ignore_errors: true

- name: Set i3 font sizes by input
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/i3/config"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^.*font pango:monospace .*"
      line: "font pango:monospace {{ '14' if font_size_choice | lower == 'l' else '10' }}"
    - regexp: "^.*font pango:Sparkles .*"
      line: "font pango:Sparkles {{ '16' if font_size_choice | lower == 'l' else '11' }}"
  when: ansible_facts["os_family"] != "RedHat"

- name: Set i3 font sizes (CentOS)
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/i3/config"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^.*font pango:monospace .*"
      line: "font pango:monospace 10"
    - regexp: "^.*font pango:Sparkles .*"
      line: "font pango:Sparkles 11"
  when: ansible_facts["os_family"] == "RedHat"

- name: Ensure lock scripts are executable
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/i3/{{ item }}"
    mode: "0755"
  loop:
    - lock.sh
    - the_real_saver.sh

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/bin"
    state: directory
    mode: "0755"

- name: Symlink lock scripts to ~/.local/bin
  ansible.builtin.file:
    src: "{{ ansible_user_dir }}/.config/i3/{{ item }}"
    dest: "{{ ansible_user_dir }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - lock.sh
    - the_real_saver.sh

- name: Reload i3
  ansible.builtin.command: i3-msg reload
  ignore_errors: true

- name: Restart i3
  ansible.builtin.command: i3-msg restart
  ignore_errors: true
